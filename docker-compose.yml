services:
  meilisearch:
    image: getmeili/meilisearch:v1.7
    restart: unless-stopped
    # Security (CSO-OPS 2026-05-21 P0-3): loopback-only. qsearch reaches it via localhost.
    ports: ["127.0.0.1:7700:7700"]
    environment:
      # P1-3: no hardcoded default. Run: docker compose --env-file .env.local up -d
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY must be set — put it in .env.local and use: docker compose --env-file .env.local up -d}
    volumes:
      - ./data/meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8888:8080"]
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: "http://localhost:8888/"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  # llama.cpp embedding server — optional, needed for vector search
  # Setup: download Qwen3-Embedding-0.6B-GGUF from HuggingFace, place in ./data/models/
