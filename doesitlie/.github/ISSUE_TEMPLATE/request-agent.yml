name: Request an agent
description: Nominate a deep-research agent for the docket. Upvote existing requests with 👍.
title: "[agent] "
labels: ["agent-request"]
body:
  - type: input
    id: agent
    attributes:
      label: Agent name
      placeholder: e.g. Perplexity Deep Research
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Access notes
      description: How runs are obtained (subscription tier, API), and anything special about its citation format.
  - type: markdown
    attributes:
      value: |
        Standing commitment: every new deep-research agent is audited on the same three legal
        briefs, by the same judge, and filed on the board — each run is its own public post.
