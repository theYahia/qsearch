# doesitlie — integrity & reproducibility gate.
#
# What runs in cloud CI (no model needed — deterministic from the committed verdict cache + audit):
#   • the bench test suite (stats / scoring / domains / agreement κ)
#   • validate.mjs — every published headline number, board metric and judge↔human κ MUST re-derive
#     from the raw receipts, or the build fails. This is the merge gate that keeps the leaderboard honest.
#   • a freshness warning when the published audit goes stale.
#
# What CANNOT run here: a fresh re-judge. The judge is a local Ollama model (qwen2.5:14b) or DeepSeek —
# cloud runners have neither. Re-judging happens on a machine with a judge:
#     npm run bench -- bench/dataset/all_submissions.json bench/out/all   # re-judge (needs Ollama/DeepSeek)
#     npm run build && npm run validate                                   # rebuild site + re-prove integrity
# To automate it, add a self-hosted runner with Ollama, or set the DEEPSEEK_API_KEY secret and a re-judge job.
name: bench-integrity
on:
  push:
    paths: ['bench/**', 'site/**', 'package.json']
  pull_request:
    paths: ['bench/**', 'site/**', 'package.json']
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC — catch silent drift + stale-audit warnings
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests (stats · scoring · domains · agreement)
        run: node --test bench/test/*.test.js
      - name: Integrity + reproducibility gate
        run: node bench/validate.mjs
