name: Challenge a verdict
description: Dispute a specific verdict on the board. The receipt is the appeal form — quote the source.
title: "[verdict] "
labels: ["verdict-challenge"]
body:
  - type: markdown
    attributes:
      value: |
        Every dispute is public and every resolution is logged. Open the row on
        [truthlode.org](https://truthlode.org), read the source excerpt, and tell us where the
        verdict is wrong — with a quote from the live source.
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: e.g. Claude Deep Research
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Cited URL
      placeholder: https://…
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict shown on the board
      options:
        - Supported
        - Partial
        - Unsupported
        - Fabricated
        - Error (coverage gap)
    validations:
      required: true
  - type: input
    id: permalink
    attributes:
      label: Permalink
      description: The board hash for the agent's row
      placeholder: https://truthlode.org/#agent/claude-deep-research
  - type: textarea
    id: why
    attributes:
      label: Why the verdict is wrong
      description: Quote the live source. "The source says X (quote), the claim says Y, so the verdict should be Z."
    validations:
      required: true
